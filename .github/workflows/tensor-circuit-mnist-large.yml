name: tensor-circuit-mnist-large

on:
  push:
    branches:
      - experiment/tensor-circuit-mnist-large
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  OMP_NUM_THREADS: "4"
  MKL_NUM_THREADS: "4"

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install NumPy
        run: python -m pip install --disable-pip-version-check "numpy<3"
      - name: Download canonical static binarized MNIST
        run: |
          mkdir -p .cache prepared
          curl --fail --location --retry 5 --retry-delay 3 \
            https://github.com/mgermain/MADE/releases/download/ICML2015/binarized_mnist.npz \
            --output .cache/binarized_mnist.npz
          test "$(stat -c%s .cache/binarized_mnist.npz)" -eq 219521332
      - name: Convert and fit product-mixture initializers
        run: |
          python experiments/tensor_circuit_mnist/prepare_data.py \
            --input .cache/binarized_mnist.npz \
            --output prepared \
            --mixture-iterations 25
      - uses: actions/upload-artifact@v4
        with:
          name: prepared-static-binarized-mnist
          path: prepared/
          compression-level: 6
          retention-days: 7

  train:
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        variant:
          - shared-r16
          - group64-r16
          - unshared-r16
          - group64-r32
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: prepared-static-binarized-mnist
          path: prepared
      - name: Install CPU PyTorch and plotting dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            --index-url https://download.pytorch.org/whl/cpu \
            torch
          python -m pip install --disable-pip-version-check "numpy<3" matplotlib
      - name: Train exact circuit
        run: |
          mkdir -p "results/${{ matrix.variant }}"
          python experiments/tensor_circuit_mnist/train.py \
            --variant "${{ matrix.variant }}" \
            --data-dir prepared \
            --output "results/${{ matrix.variant }}" \
            --batch-size 256 \
            --seed 1234
      - uses: actions/upload-artifact@v4
        with:
          name: result-${{ matrix.variant }}
          path: results/${{ matrix.variant }}/
          compression-level: 6
          retention-days: 7
