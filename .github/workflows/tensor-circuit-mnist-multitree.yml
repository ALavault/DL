name: tensor-circuit-mnist-multitree

on:
  push:
    branches:
      - experiment/tensor-circuit-mnist-multitree
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  OMP_NUM_THREADS: "4"
  MKL_NUM_THREADS: "4"

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install NumPy
        run: python -m pip install --disable-pip-version-check "numpy<3"
      - name: Download canonical static binarized MNIST
        run: |
          mkdir -p .cache prepared
          curl --fail --location --retry 5 --retry-delay 3 \
            https://github.com/mgermain/MADE/releases/download/ICML2015/binarized_mnist.npz \
            --output .cache/binarized_mnist.npz
          test "$(stat -c%s .cache/binarized_mnist.npz)" -eq 219521332
      - name: Convert and fit product-mixture initializers
        run: |
          python experiments/tensor_circuit_mnist/prepare_data.py \
            --input .cache/binarized_mnist.npz \
            --output prepared \
            --mixture-iterations 25
      - uses: actions/upload-artifact@v4
        with:
          name: prepared-static-binarized-mnist-multitree
          path: prepared/
          compression-level: 6
          retention-days: 7

  train-component:
    needs: prepare
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        component:
          - morton-center-xy-s1234
          - morton-center-yx-s1234
          - hilbert-center-s1234
          - snake-row-center-s1234
          - morton-topleft-xy-s1234
          - morton-bottomright-xy-s1234
          - morton-center-xy-s2234
          - morton-center-xy-s3234
          - morton-center-xy-s4234
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: prepared-static-binarized-mnist-multitree
          path: prepared
      - name: Install CPU PyTorch and plotting dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            --index-url https://download.pytorch.org/whl/cpu \
            torch
          python -m pip install --disable-pip-version-check "numpy<3" matplotlib
      - name: Train exact rank-16 tree component
        run: |
          mkdir -p "results/${{ matrix.component }}"
          python experiments/tensor_circuit_mnist/train_multitree_component.py \
            --component "${{ matrix.component }}" \
            --data-dir prepared \
            --output "results/${{ matrix.component }}" \
            --batch-size 256 \
            --epochs 36 \
            --patience 8 \
            --rank 16 \
            --max-groups 64 \
            --learning-rate 0.003
      - uses: actions/upload-artifact@v4
        with:
          name: component-${{ matrix.component }}
          path: results/${{ matrix.component }}/
          compression-level: 6
          retention-days: 7

  train-mixtures:
    needs:
      - prepare
      - train-component
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          name: prepared-static-binarized-mnist-multitree
          path: prepared
      - uses: actions/download-artifact@v4
        with:
          pattern: component-*
          path: components
          merge-multiple: false
      - name: Install CPU PyTorch and plotting dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            --index-url https://download.pytorch.org/whl/cpu \
            torch
          python -m pip install --disable-pip-version-check "numpy<3" matplotlib
      - name: Select and jointly fine-tune exact four-tree mixtures
        run: |
          mkdir -p results/multitree
          python experiments/tensor_circuit_mnist/train_multitree_mixture.py \
            --data-dir prepared \
            --component-root components \
            --output results/multitree \
            --batch-size 192 \
            --joint-epochs 10 \
            --seed 9001
      - uses: actions/upload-artifact@v4
        with:
          name: result-multitree-cycle
          path: results/multitree/
          compression-level: 6
          retention-days: 14
